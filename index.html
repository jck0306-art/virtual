<!-- [뷰 7] 반택 주소록 -->
<section id="menu-view-deliveries" class="hidden glass rounded-3xl p-5 md:p-6 shadow-xl space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h3 class="text-sm font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-truck text-cyan-400"></i> GS25 / CU 편의점 반택 주소록
      </h3>
      <p class="text-xs text-slate-400 mt-0.5">이름 가나다순으로 정렬됩니다. 필요한 항목의 배송 정보를 클릭해 복사하세요.</p>
    </div>
    
    <div class="flex items-center gap-2 flex-wrap">
      <input id="excel-file-input" type="file" accept=".xlsx, .xls" onchange="window.handleExcelUpload(event)" class="hidden" />

      <button type="button" onclick="window.downloadDeliveryTemplate()" class="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 hover:border-emerald-500/40 px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition shadow-sm">
        <i class="fa-solid fa-file-arrow-down"></i> 양식 다운로드
      </button>

      <button type="button" onclick="document.getElementById('excel-file-input').click()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition shadow-md shadow-emerald-600/20">
        <i class="fa-solid fa-file-excel"></i> 엑셀 일괄 등록
      </button>

      <button type="button" onclick="window.openDeliveryModal()" class="text-xs bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-xl font-bold flex items-center gap-1.5 transition shadow-md shadow-cyan-600/20">
        <i class="fa-solid fa-plus"></i> 배송지 직접 등록
      </button>
    </div>
  </div>

  <!-- 테이블 리스트 컨테이너 -->
  <div class="overflow-x-auto border border-slate-800 rounded-2xl bg-slate-900/60 shadow-inner">
    <table class="w-full text-left text-xs border-collapse min-w-[700px]">
      <thead class="bg-slate-900 border-b border-slate-800 text-slate-400 text-[11px] select-none">
        <tr>
          <th class="py-3 px-3.5 text-center w-20">종류</th>
          <th class="py-3 px-3.5 text-center w-24">상태</th>
          <th class="py-3 px-3.5 w-40">받는분 (이름)</th>
          <th class="py-3 px-3.5 w-32 font-mono">전화번호</th>
          <th class="py-3 px-3.5">도착 점포명</th>
          <th class="py-3 px-3.5">품목 / 메모</th>
          <th class="py-3 px-3.5 text-center w-24">복사</th>
          <th class="py-3 px-3.5 text-center w-16">관리</th>
        </tr>
      </thead>
      <tbody id="delivery-table-body" class="divide-y divide-slate-800/60"></tbody>
    </table>
  </div>
</section>
